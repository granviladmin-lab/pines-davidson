<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Private Preview</title>
<style>
  :root { --pine: #084933; --cream: #f7f3ea; --ink: #1d2420; --muted: #5b655f; --line: #e2dccd; --bad: #a3361f; }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 16px; background: var(--cream); color: var(--ink); font: 400 1rem/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
  form { width: min(380px, 100%); background: #fffdf8; border: 1px solid var(--line); border-radius: 18px; padding: 36px 32px; box-shadow: 0 24px 48px -32px rgba(0,0,0,.35); }
  .lock { width: 44px; height: 44px; border-radius: 50%; background: var(--pine); display: grid; place-items: center; margin-bottom: 18px; }
  h1 { font-size: 1.35rem; font-weight: 600; margin: 0 0 6px; }
  p { color: var(--muted); margin: 0 0 22px; font-size: .95rem; }
  label { display: block; font-size: .85rem; font-weight: 500; color: var(--muted); margin-bottom: 6px; }
  input { width: 100%; font: inherit; padding: 12px 14px; border: 1px solid var(--line); border-radius: 10px; background: #fff; color: var(--ink); }
  input:focus { outline: 2px solid var(--pine); border-color: var(--pine); }
  button { width: 100%; margin-top: 16px; padding: 13px; border: 0; border-radius: 999px; background: var(--pine); color: #fff; font: 600 1rem/1 inherit; font-family: inherit; cursor: pointer; }
  button:disabled { opacity: .6; cursor: wait; }
  .msg { min-height: 1.5em; margin: 12px 0 0; font-size: .88rem; color: var(--bad); }
</style>
</head>
<body>
<form id="f" autocomplete="off">
  <div class="lock" aria-hidden="true">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round"><rect x="4" y="10" width="16" height="11" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg>
  </div>
  <h1>Private preview</h1>
  <p>Enter the password to continue.</p>
  <label for="pw">Password</label>
  <input id="pw" type="password" required autofocus>
  <button id="go" type="submit">Unlock</button>
  <p class="msg" id="msg" role="alert"></p>
</form>
<script>
const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
const idb = () => new Promise((res, rej) => {
  const r = indexedDB.open('gate', 1);
  r.onupgradeneeded = () => r.result.createObjectStore('k');
  r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error);
});
const idbPut = async (k, v) => { const db = await idb(); return new Promise((res, rej) => { const t = db.transaction('k', 'readwrite'); t.objectStore('k').put(v, k); t.oncomplete = res; t.onerror = () => rej(t.error); }); };
const idbGet = async k => { const db = await idb(); return new Promise((res, rej) => { const r = db.transaction('k').objectStore('k').get(k); r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); }); };

const next = () => {
  const n = new URLSearchParams(location.search).get('next') || '';
  return n.startsWith('site/') ? n : 'site/';
};
const enter = async () => {
  await navigator.serviceWorker.register('sw.js', { scope: './' });
  await navigator.serviceWorker.ready;
  location.replace(next());
};

const msg = document.getElementById('msg'), btn = document.getElementById('go');
if (!('serviceWorker' in navigator) || !crypto.subtle) {
  msg.textContent = 'This browser can’t open the preview. Try a current version of Chrome, Safari, Edge or Firefox (not a private window).';
  btn.disabled = true;
} else {
  idbGet('key').then(k => k && enter()).catch(() => {});
}

document.getElementById('f').addEventListener('submit', async e => {
  e.preventDefault();
  btn.disabled = true; msg.textContent = '';
  try {
    const meta = await (await fetch('meta.json', { cache: 'no-store' })).json();
    const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(document.getElementById('pw').value), 'PBKDF2', false, ['deriveKey']);
    const key = await crypto.subtle.deriveKey({ name: 'PBKDF2', hash: 'SHA-256', salt: b64(meta.salt), iterations: meta.iter }, base, { name: 'AES-GCM', length: 256 }, false, ['decrypt']);
    const chk = b64(meta.check);
    try { await crypto.subtle.decrypt({ name: 'AES-GCM', iv: chk.slice(0, 12) }, key, chk.slice(12)); }
    catch { msg.textContent = 'That password isn’t right.'; btn.disabled = false; return; }
    await idbPut('key', key);
    await idbPut('pathSalt', meta.pathSalt);
    await enter();
  } catch (err) {
    msg.textContent = 'Something went wrong: ' + err.message;
    btn.disabled = false;
  }
});
</script>
</body>
</html>
